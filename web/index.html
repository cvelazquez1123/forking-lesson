<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="color-scheme" content="dark">
<title>Fragrance Finder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0e0f13; --card:#16181f; --card-2:#1c1f28; --line:#252936;
  --fg:#e8eaf0; --dim:#8b90a0; --dimmer:#5f6474;
  --accent:#f2b544; --good:#4ade80; --warn:#fb923c; --dupe:#a78bfa;
  --tap:48px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-wrap:anywhere;
  padding-bottom:env(safe-area-inset-bottom);
}
header.top{
  position:sticky; top:0; z-index:10; background:rgba(14,15,19,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.brandbar{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.brandbar h1{font-size:15px;margin:0;letter-spacing:.02em;font-weight:650}
.brandbar h1 span{color:var(--accent)}
.brandbar .stat{font-size:11.5px;color:var(--dimmer);margin-left:auto;text-align:right;line-height:1.3}
input[type=search]{
  width:100%; height:var(--tap); border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); font-size:17px; padding:0 14px;
  -webkit-appearance:none; appearance:none;
}
input[type=search]:focus{outline:none;border-color:var(--accent)}
main{padding:12px 12px 40px;max-width:720px;margin:0 auto}
.notice{
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--warn);
  border-radius:9px; padding:9px 11px; font-size:12.5px; color:var(--dim); margin-bottom:12px;
}
.notice b{color:var(--warn)}
.hint{color:var(--dimmer);font-size:13.5px;text-align:center;padding:44px 20px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.card > h2{margin:0;padding:11px 13px 9px;font-size:15px;font-weight:600;line-height:1.3}
.card > h2 .b{color:var(--dim);font-weight:500;font-size:13px;display:block;letter-spacing:.03em;text-transform:uppercase}
.tags{padding:0 13px 9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--dim);background:var(--card-2)}
.tag.conc{color:var(--fg)}
.tag.dupe{color:var(--dupe);border-color:#3b2f5c}
.tag.low{color:var(--dimmer);border:0;background:none;padding:2px 0}
.tag.low.good{color:var(--good)}
.tag.low.high{color:var(--warn)}
a.row{
  display:flex;align-items:center;gap:10px;min-height:var(--tap);
  padding:9px 13px;border-top:1px solid var(--line);
  text-decoration:none;color:inherit;-webkit-tap-highlight-color:rgba(242,181,68,.15);
}
a.row:active{background:var(--card-2)}
a.row.best{background:var(--card-2);box-shadow:inset 3px 0 0 var(--accent)}
.row .l{min-width:0;flex:1}
.row .store{display:block;font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
.row .r{text-align:right;white-space:nowrap}
.row .ppml{display:block;font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.row.best .ppml{font-size:19px}
.row .ppml small{font-size:10.5px;font-weight:500;color:var(--dimmer);margin-left:1px}
.row .landed{display:block;font-size:12px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;vertical-align:1px}
.badge.tester{background:#2a3a2c;color:#8fd39a}
.badge.sealed{background:#242a3a;color:#93a7d8}
.badge.unboxed{background:#3a3226;color:#d8b98a}
.badge.unknown{background:#262a33;color:var(--dim)}
.badge.pre{background:#3a2630;color:#f0a0b8;margin-left:5px}
button.more{
  width:100%;min-height:40px;background:none;border:0;border-top:1px solid var(--line);
  color:var(--dim);font-size:12.5px;font-family:inherit;cursor:pointer;
}
button.more:active{background:var(--card-2)}
details.stores{margin-top:20px;font-size:12.5px;color:var(--dim)}
details.stores summary{cursor:pointer;padding:8px 2px;color:var(--dimmer)}
details.stores table{width:100%;border-collapse:collapse;margin-top:6px}
details.stores td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
details.stores td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.err{color:var(--warn)}
</style>
</head>
<body>
<header class="top">
  <div class="brandbar">
    <h1>fragrance<span>·</span>finder</h1>
    <div class="stat" id="stat">loading…</div>
  </div>
  <input type="search" id="q" placeholder="Layton, Aventus, Khamrah…"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
         enterkeyhint="search" aria-label="Search fragrances">
</header>
<main>
  <div id="notices"></div>
  <div id="results"></div>
  <details class="stores" id="storebox" hidden>
    <summary>stores in this index</summary>
    <table id="storetable"></table>
  </details>
</main>

<script>
(function(){
"use strict";
var DATA = null, LOWS = {}, LOW_WINDOW = 90, MAX_CARDS = 30, COLLAPSE_AT = 4;
var $q = document.getElementById('q'),
    $results = document.getElementById('results'),
    $stat = document.getElementById('stat'),
    $notices = document.getElementById('notices');

/* --- helpers --- */
function fold(s){
  s = (s == null ? '' : String(s));
  try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e){}
  return s.toLowerCase();
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(n){ return '$' + Number(n).toFixed(2); }
function perMl(n){ return '$' + Number(n).toFixed(n < 1 ? 3 : 2); }
function ago(iso){
  var t = Date.parse(iso); if (isNaN(t)) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 48 * 60) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}

/* --- search --- */
function haystack(item){
  if (item._h === undefined) item._h = fold((item.brand || '') + ' ' + (item.line || ''));
  return item._h;
}
function bestPpml(item){ return item.listings.length ? item.listings[0].price_per_ml : Infinity; }

function search(query){
  var tokens = fold(query).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  var hits = [];
  for (var i = 0; i < DATA.items.length; i++){
    var item = DATA.items[i], hay = haystack(item), ok = true;
    for (var t = 0; t < tokens.length; t++){
      if (hay.indexOf(tokens[t]) === -1){ ok = false; break; }
    }
    if (!ok) continue;
    var lineStarts = fold(item.line).indexOf(tokens[0]) === 0 ? 0 : 1;
    hits.push([lineStarts, bestPpml(item), item]);
  }
  hits.sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; });
  return hits.map(function(h){ return h[2]; });
}

/* --- render --- */
function lowTag(item){
  var low = LOWS[item.key];
  if (!low || low.samples < 3) return '';   // one or two readings is not a trend
  var best = bestPpml(item);
  if (!isFinite(best)) return '';
  if (best <= low.low + 1e-9)
    return '<span class="tag low good">at ' + LOW_WINDOW + '-day low</span>';
  var pct = Math.round((best - low.low) / low.low * 100);
  var cls = pct >= 15 ? 'high' : '';
  return '<span class="tag low ' + cls + '">+' + pct + '% vs ' + LOW_WINDOW +
         'd low ' + esc(perMl(low.low)) + '/ml (' + esc(low.low_date) + ')</span>';
}

function rowHtml(l, isBest){
  var pre = l.preorder ? '<span class="badge pre">pre-order</span>' : '';
  return '<a class="row' + (isBest ? ' best' : '') + '" target="_blank" rel="noopener noreferrer" href="' +
    esc(l.url) + '">' +
      '<span class="l">' +
        '<span class="store">' + esc(l.store) + '</span>' +
        '<span class="sub">' + esc(l.size_ml) + 'ml · ' +
          '<span class="badge ' + esc(l.condition) + '">' + esc(l.condition) + '</span>' + pre +
        '</span>' +
      '</span>' +
      '<span class="r">' +
        '<span class="ppml">' + esc(perMl(l.price_per_ml)) + '<small>/ml</small></span>' +
        '<span class="landed">' + esc(money(l.landed)) + ' landed</span>' +
      '</span>' +
    '</a>';
}

function cardHtml(item){
  var listings = item.listings, shown = listings.slice(0, COLLAPSE_AT), rest = listings.slice(COLLAPSE_AT);
  var tags = '';
  if (item.concentration) tags += '<span class="tag conc">' + esc(item.concentration) + '</span>';
  if (item.key.indexOf('dupe:') === 0) tags += '<span class="tag dupe">dupe house</span>';
  tags += '<span class="tag">' + listings.length + ' listing' + (listings.length === 1 ? '' : 's') + '</span>';
  tags += lowTag(item);

  var html = '<article class="card" data-key="' + esc(item.key) + '">' +
    '<h2>' + (item.brand ? '<span class="b">' + esc(item.brand) + '</span>' : '') + esc(item.line) + '</h2>' +
    '<div class="tags">' + tags + '</div>' +
    shown.map(function(l, i){ return rowHtml(l, i === 0); }).join('');
  if (rest.length){
    html += '<div class="rest" hidden>' + rest.map(function(l){ return rowHtml(l, false); }).join('') + '</div>' +
            '<button class="more" type="button">show ' + rest.length + ' more</button>';
  }
  return html + '</article>';
}

function render(query){
  if (!DATA) return;
  if (!query.trim()){
    $results.innerHTML = '<p class="hint">' + DATA.items.length.toLocaleString() +
      ' fragrances across ' + DATA.stores.filter(function(s){ return !s.error; }).length +
      ' stores.<br>Type a name to compare landed price per ml.</p>';
    return;
  }
  var hits = search(query);
  if (!hits.length){
    $results.innerHTML = '<p class="hint">Nothing matching “' + esc(query) + '”.<br>' +
      'Try just the line name — “layton”, not “pdm layton 125”.</p>';
    return;
  }
  var html = hits.slice(0, MAX_CARDS).map(cardHtml).join('');
  if (hits.length > MAX_CARDS)
    html += '<p class="hint">Showing ' + MAX_CARDS + ' of ' + hits.length + ' matches.</p>';
  $results.innerHTML = html;
}

$results.addEventListener('click', function(ev){
  var btn = ev.target.closest && ev.target.closest('button.more');
  if (!btn) return;
  var rest = btn.parentNode.querySelector('.rest');
  if (rest.hidden){ rest.hidden = false; btn.textContent = 'show fewer'; }
  else { rest.hidden = true; btn.textContent = 'show ' + rest.children.length + ' more'; }
});

var timer = null;
$q.addEventListener('input', function(){
  clearTimeout(timer);
  timer = setTimeout(function(){ render($q.value); }, 70);
});

/* --- boot --- */
function notice(html){ $notices.insertAdjacentHTML('beforeend', '<div class="notice">' + html + '</div>'); }

function renderStores(){
  var box = document.getElementById('storebox'), table = document.getElementById('storetable');
  table.innerHTML = DATA.stores.map(function(s){
    var right = s.error ? '<span class="err">' + esc(s.error) + '</span>'
                        : s.rows.toLocaleString() + ' listings';
    var bits = [];
    if (s.coupon) bits.push('code ' + esc(s.coupon));
    if (s.free_ship_threshold) bits.push('free ship ≥ ' + money(s.free_ship_threshold));
    if (s.flat_ship == null) bits.push('ship cost unknown');
    if (s.sells_dupes) bits.push('dupes');
    return '<tr><td>' + esc(s.name || s.domain) +
           (bits.length ? '<br><span style="color:var(--dimmer);font-size:11.5px">' + bits.join(' · ') + '</span>' : '') +
           '</td><td>' + right + '</td></tr>';
  }).join('');
  box.hidden = false;
}

function boot(data, lows, stale){
  DATA = data;
  LOWS = (lows && lows.lows) || {};
  LOW_WINDOW = (lows && lows.window_days) || 90;
  $stat.innerHTML = esc(DATA.items.length.toLocaleString()) + ' fragrances<br>' +
                    esc(ago(DATA.generated_at) || DATA.generated_at);
  if (DATA.demo)
    notice('<b>Demo data.</b> This index was built from local fixtures, not a live scrape. ' +
           'The first GitHub Action run replaces it.');
  if (stale) notice('<b>Offline.</b> Showing the last cached index.');
  var broken = DATA.stores.filter(function(s){ return s.error; });
  if (broken.length)
    notice('<b>' + broken.length + ' store' + (broken.length === 1 ? '' : 's') +
           ' missing</b> from this run: ' +
           esc(broken.map(function(s){ return s.domain; }).join(', ')) + '.');
  renderStores();
  render($q.value);
  if (!('ontouchstart' in window)) $q.focus();
}

function getJSON(url){
  return fetch(url, {cache: 'no-cache'}).then(function(r){
    if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status);
    return r.json();
  });
}

Promise.all([
  getJSON('data/index.json'),
  getJSON('data/lows.json').catch(function(){ return null; })
]).then(function(res){
  boot(res[0], res[1], false);
}).catch(function(err){
  // Network died: the service worker cache is the fallback.
  caches.match('data/index.json').then(function(hit){
    if (!hit) {
      $results.innerHTML = '<p class="hint">Could not load the index.<br>' + esc(err.message) + '</p>';
      $stat.textContent = 'offline';
      return;
    }
    hit.json().then(function(data){
      caches.match('data/lows.json').then(function(l){
        (l ? l.json() : Promise.resolve(null)).then(function(lows){ boot(data, lows, true); });
      });
    });
  });
});

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline is a bonus, not a requirement */ });
  });
}
})();
</script>
</body>
</html>

name: scrape

on:
  schedule:
    # every 6h, offset off the hour so we are not part of the :00 stampede
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      eyeball_domain:
        description: 'Print 50 parsed rows from this domain, sorted by size_ml'
        required: false
        default: 'aurafragrance.com'

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test the normalizer
        # The parse rules are the whole product. If they regress, do not publish.
        run: python -m unittest discover -s test

      - name: Build index
        run: python src/build_index.py

      - name: Eyeball parsed rows
        # Manual runs print a sample with the raw titles beside the parsed size,
        # so size parsing can be checked against real listings before the prices
        # are trusted. Passed through env, never interpolated into the script.
        if: github.event_name == 'workflow_dispatch'
        env:
          EYEBALL_DOMAIN: ${{ inputs.eyeball_domain }}
        run: |
          if [ -z "$EYEBALL_DOMAIN" ]; then
            echo "no eyeball domain requested"
            exit 0
          fi
          python src/shopify.py "$EYEBALL_DOMAIN" \
            --sample 50 --sort size_ml --show-title 2>&1 | tee /tmp/eyeball.txt
          {
            echo "### 50 parsed rows from $EYEBALL_DOMAIN (by size_ml)"
            echo '```'
            cat /tmp/eyeball.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if changed
        run: |
          git config user.name  "fragrance-finder bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/index.json web/data/lows.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push failed, retry $attempt"
            sleep $((2 ** attempt))
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              d = json.load(open('web/data/index.json'))
          except Exception as e:
              print(f'index.json unreadable: {e}'); raise SystemExit(0)
          print(f"### {len(d['items'])} fragrances\n")
          print(f"generated `{d['generated_at']}`\n")
          print('| store | listings | note |')
          print('|---|---:|---|')
          for s in d['stores']:
              print(f"| {s['domain']} | {s['rows']} | {s.get('error') or ''} |")
          PY
